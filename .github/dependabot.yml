# Dependabot opens one pull request each week for newer versions of the npm packages of Apostil.
# A new version waits 7 days first: a bad release is mostly found and taken off npm within days. A security update does not wait.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # The minor and patch updates come in one pull request; a major update comes in a pull request of its own.
      small-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @types/vscode follows engines.vscode in package.json: vsce does not package an extension whose types are newer than its engine.
      - dependency-name: "@types/vscode"
      # @types/node follows engines.node (24): its next major version describes a newer Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
