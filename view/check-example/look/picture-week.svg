<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" width="480" height="190" font-family="Helvetica, Arial, sans-serif">
  <!-- Made up for the example: the opening hours of the four branches of the library app, from 06:00 to 20:00. -->
  <rect width="480" height="190" rx="8" fill="#f6f3ee"/>
  <text x="16" y="26" font-size="13" font-weight="bold" fill="#1a2b24">Opening hours of a day</text>
  <g font-size="11" fill="#4a5752">
    <text x="16" y="62">North</text>
    <text x="16" y="94">Harbour</text>
    <text x="16" y="126">Old Town</text>
    <text x="16" y="158">Station</text>
  </g>
  <g stroke="#ddd6cc">
    <line x1="96" y1="40" x2="96" y2="170"/>
    <line x1="216" y1="40" x2="216" y2="170"/>
    <line x1="312" y1="40" x2="312" y2="170"/>
    <line x1="432" y1="40" x2="432" y2="170"/>
  </g>
  <g fill="#0f766e">
    <rect x="168" y="52" width="216" height="14" rx="7"/>
    <rect x="144" y="84" width="192" height="14" rx="7"/>
    <rect x="192" y="116" width="168" height="14" rx="7"/>
    <rect x="120" y="148" width="288" height="14" rx="7"/>
  </g>
  <g font-size="10" fill="#6b6b6b" text-anchor="middle">
    <text x="96" y="184">06:00</text>
    <text x="216" y="184">11:00</text>
    <text x="312" y="184">15:00</text>
    <text x="432" y="184">20:00</text>
  </g>
</svg>
